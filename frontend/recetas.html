<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Recetas – SaborLab</title>
  <link rel="stylesheet" href="./css/estilos.css">
</head>
<body>

  <header class="main-header">
    <h1 class="logo">SaborLab</h1>
    <nav class="main-nav">
      <a href="./index.html">Inicio</a>
      <a href="./recetas.html">Ver recetas</a>
      <a href="./crear-receta.html">Crear receta</a>
    </nav>
  </header>
  <hr>

  <main>
  <h2>Recetas disponibles</h2>

  <section id="filtros">
    <form id="formFiltros">
      <label>
        Categoría:
        <input type="text" id="filtroCategoria" placeholder="Ej: Pasta, Postre, Desayuno">
      </label>

      <label style="margin-left: 1rem;">
        Ingrediente:
        <input type="text" id="filtroIngrediente" placeholder="Ej: pollo, arroz, pesto">
      </label>

      <button type="submit">Buscar</button>
      <button type="button" id="btnLimpiar">Limpiar</button>
    </form>
  </section>

  <hr>

  <div id="listaRecetas">
    Cargando recetas...
  </div>
</main>

  <script src="./js/recetas.js"></script>
</body>
</html>
