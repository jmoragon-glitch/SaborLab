<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Recetas – SaborLab</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- Tus estilos -->
  <link rel="stylesheet" href="./css/estilos.css" />
</head>
<body class="bg-light">

  <header>
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom" aria-label="Navegación principal">
      <div class="container">
        <a class="navbar-brand fw-bold" href="./index.html">SaborLab</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false" aria-label="Mostrar u ocultar navegación">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" href="./index.html">Inicio</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="./recetas.html">Ver recetas</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="./crear-receta.html">Crear receta</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container my-4">
    <h1 class="h3 mb-4">Recetas disponibles</h1>

    <!-- Filtros -->
    <section id="filtros" class="mb-4" aria-label="Filtros de búsqueda de recetas">
      <form id="formFiltros" class="row g-3 align-items-end">
        <div class="col-md-4">
          <label for="filtroCategoria" class="form-label">Categoría</label>
          <input
            type="text"
            id="filtroCategoria"
            class="form-control"
            placeholder="Ej: Pasta, Postre, Desayuno"
          />
        </div>

        <div class="col-md-4">
          <label for="filtroIngrediente" class="form-label">Ingrediente</label>
          <input
            type="text"
            id="filtroIngrediente"
            class="form-control"
            placeholder="Ej: pollo, arroz, pesto"
          />
        </div>

        <div class="col-md-4 d-flex gap-2">
          <button type="submit" class="btn btn-primary mt-3 mt-md-0">
            Buscar
          </button>
          <button type="button" id="btnLimpiar" class="btn btn-outline-secondary mt-3 mt-md-0">
            Limpiar
          </button>
        </div>
      </form>
    </section>

    <hr />

    <!-- Listado de recetas -->
    <div id="listaRecetas" class="row gy-3">
      Cargando recetas...
    </div>
  </main>

  <script src="./js/recetas.js"></script>
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  ></script>
</body>
</html>
