<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Crear receta – SaborLab</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- Tus estilos -->
  <link rel="stylesheet" href="./css/estilos.css" />
</head>
<body class="bg-light">

  <header>
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom" aria-label="Navegación principal">
      <div class="container">
        <a class="navbar-brand fw-bold" href="./index.html">SaborLab</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false" aria-label="Mostrar u ocultar navegación">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" href="./index.html">Inicio</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="./recetas.html">Ver recetas</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="./crear-receta.html">Crear receta</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="./login.html">Iniciar sesión</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container my-4">
    <h1 class="h3 mb-4">Crear nueva receta</h1>

    <form id="formCrearReceta" class="row g-3" aria-label="Formulario para crear una nueva receta">

      <div class="col-12">
        <label for="titulo" class="form-label">Título de la receta <span class="text-danger">*</span></label>
        <input
          type="text"
          id="titulo"
          class="form-control"
          required
          aria-required="true"
        />
      </div>

      <div class="col-12">
        <label for="descripcion" class="form-label">Descripción</label>
        <textarea
          id="descripcion"
          class="form-control"
          rows="3"
        ></textarea>
      </div>

      <div class="col-md-4">
        <label for="categoria" class="form-label">Categoría</label>
        <input
          type="text"
          id="categoria"
          class="form-control"
          placeholder="Ej: Pasta, Postre, Desayuno"
        />
      </div>

      <div class="col-md-4">
        <label for="dificultad" class="form-label">Dificultad</label>
        <select id="dificultad" class="form-select">
          <option value="facil">Fácil</option>
          <option value="media">Media</option>
          <option value="dificil">Difícil</option>
        </select>
      </div>

      <div class="col-md-4">
        <label for="tiempoPreparacion" class="form-label">Tiempo de preparación (minutos)</label>
        <input
          type="number"
          id="tiempoPreparacion"
          class="form-control"
          min="1"
        />
      </div>

      <div class="col-md-4">
        <label for="porciones" class="form-label">Porciones</label>
        <input
          type="number"
          id="porciones"
          class="form-control"
          min="1"
        />
      </div>

      <div class="col-md-4">
        <label for="presupuestoPorPorcion" class="form-label">Presupuesto por porción (₡)</label>
        <input
          type="number"
          id="presupuestoPorPorcion"
          class="form-control"
          min="0"
        />
      </div>

      <div class="col-12">
        <label for="ingredientes" class="form-label">
          Ingredientes <span class="text-muted">(uno por línea)</span>
        </label>
        <textarea
          id="ingredientes"
          class="form-control"
          rows="4"
          aria-describedby="ayudaIngredientes"
        ></textarea>
        <div id="ayudaIngredientes" class="form-text">
          Ejemplo: <br>
          Arroz blanco cocido<br>
          Frijoles negros<br>
          Culantro picado
        </div>
      </div>

      <div class="col-12">
        <label for="pasos" class="form-label">
          Pasos <span class="text-muted">(uno por línea)</span>
        </label>
        <textarea
          id="pasos"
          class="form-control"
          rows="4"
          aria-describedby="ayudaPasos"
        ></textarea>
        <div id="ayudaPasos" class="form-text">
          Ejemplo: <br>
          Sofreír cebolla y chile dulce.<br>
          Agregar arroz y frijoles.<br>
          Mezclar bien y servir caliente.
        </div>
      </div>

      <div class="col-12 d-flex gap-2 align-items-center">
        <button type="submit" class="btn btn-primary">
          Guardar receta
        </button>
        <a href="./recetas.html" class="btn btn-outline-secondary">
          Volver al listado
        </a>
      </div>

      <div class="col-12">
        <p id="mensaje" class="fw-semibold"></p>
      </div>
    </form>
  </main>

  <script src="./js/crear-receta.js"></script>
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  ></script>
</body>
</html>
