  <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom" aria-label="Navegación principal">

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNav">
        
<ul class="navbar-nav ms-auto mb-2 mb-lg-0">
  <li class="nav-item"><a class="nav-link" href="./index.html">Inicio</a></li>
  <li class="nav-item"><a class="nav-link" href="./recetas.html">Ver recetas</a></li>

<main id="mainContent" class="container my-4">
  <h1 class="h3 mb-4">Crear nueva receta</h1>

  <form id="formCrearReceta" class="row g-3" aria-label="Formulario para crear una receta">

    <div class="col-12">
      <label for="titulo" class="form-label">Título <span class="text-danger">*</span></label>
      <input type="text" id="titulo" class="form-control" required />
    </div>

    <div class="col-12">
      <label for="descripcion" class="form-label">Descripción</label>
      <textarea id="descripcion" class="form-control" rows="3"></textarea>
    </div>

    <div class="col-md-4">
      <label for="categoria" class="form-label">Categoría</label>
      <input type="text" id="categoria" class="form-control" />
    </div>

    <div class="col-md-4">
      <label for="dificultad" class="form-label">Dificultad</label>
      <select id="dificultad" class="form-select">
        <option value="facil">Fácil</option>
        <option value="media">Media</option>
        <option value="dificil">Difícil</option>
      </select>
    </div>

    <div class="col-md-4">
      <label for="tiempoPreparacion" class="form-label">Tiempo (min)</label>
      <input type="number" id="tiempoPreparacion" class="form-control" min="1" />
    </div>

    <div class="col-md-4">
      <label for="porciones" class="form-label">Porciones</label>
      <input type="number" id="porciones" class="form-control" min="1" />
    </div>

    <div class="col-md-4">
      <label for="presupuestoPorPorcion" class="form-label">Presupuesto (₡)</label>
      <input type="number" id="presupuestoPorPorcion" class="form-control" min="0" />
    </div>

    <div class="col-12">
      <label for="ingredientes" class="form-label">Ingredientes</label>
      <textarea id="ingredientes" class="form-control" rows="4"></textarea>
    </div>

    <div class="col-12">
      <label for="pasos" class="form-label">Pasos</label>
      <textarea id="pasos" class="form-control" rows="4"></textarea>
    </div>

    <div class="col-12 d-flex gap-2">
      <button class="btn btn-primary" type="submit">Guardar receta</button>
      <a href="./recetas.html" class="btn btn-outline-secondary">Volver</a>
    </div>

    <p id="mensaje" class="fw-semibold mt-2"></p>

  </form>
</main>

<script src="./js/crear-receta.js"></script>
<script src="./js/sesion.js"></script>
<script src="./bootstrap/js/bootstrap.bundle.min.js"></script>

</body>
</html>
