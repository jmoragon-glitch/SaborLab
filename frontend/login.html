<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Iniciar sesión – SaborLab</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="./css/estilos.css" />
</head>

<body class="bg-light">

  <main class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="card shadow-sm" style="max-width: 420px; width: 100%;">
      <div class="card-body">
        <h1 class="h4 mb-4 text-center">Iniciar sesión</h1>

        <form id="formLogin" class="row g-3" aria-label="Formulario de inicio de sesión">
          <div class="col-12">
            <label for="email" class="form-label">Correo electrónico</label>
            <input
              type="email"
              class="form-control"
              id="email"
              required
              aria-required="true"
            />
          </div>

          <div class="col-12">
            <label for="password" class="form-label">Contraseña</label>
            <input
              type="password"
              class="form-control"
              id="password"
              required
              aria-required="true"
            />
          </div>

          <div class="col-12">
            <button class="btn btn-primary w-100" type="submit">
              Entrar
            </button>
          </div>

          <p id="mensaje" class="text-center mt-2 fw-semibold"></p>
        </form>
      </div>
    </div>
  </main>

  <script src="./js/login.js"></script>
</body>
</html>
